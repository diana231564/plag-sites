<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Digital Lookbook</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Playfair Display','Georgia',serif}
  body{background:#faf8f5;color:#1a1a1a;overflow-x:hidden}
  header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:25px 60px;z-index:100;background:linear-gradient(180deg,rgba(250,248,245,.95),transparent);backdrop-filter:blur(5px)}
  .logo{font-size:28px;font-weight:400;letter-spacing:10px;color:#1a1a1a}
  nav a{color:#1a1a1a;text-decoration:none;margin:0 20px;font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.7;transition:.3s}
  nav a:hover{opacity:1}
  .cart-btn{background:none;border:1px solid #1a1a1a;padding:10px 25px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:.3s}
  .cart-btn:hover{background:#1a1a1a;color:#faf8f5}
  .hero{height:90vh;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,#e8e0d5,#d5c8b8);overflow:hidden}
  .hero-content{text-align:center;z-index:2;padding:0 20px}
  .hero .eyebrow{font-size:12px;letter-spacing:8px;text-transform:uppercase;color:#8a7a6a;margin-bottom:30px}
  .hero h1{font-size:110px;font-weight:400;letter-spacing:15px;color:#1a1a1a;margin-bottom:20px;line-height:1}
  .hero p{font-size:18px;font-style:italic;color:#5a4a3a;letter-spacing:2px}
  .hero .scroll-hint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:#8a7a6a;animation:bounce 2s infinite}
  @keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(10px)}}
  .section-intro{padding:80px 60px 40px;text-align:center}
  .section-intro h2{font-size:36px;font-weight:400;letter-spacing:5px;font-style:italic;color:#1a1a1a}
  .section-intro p{font-size:15px;color:#7a6a5a;margin-top:15px;letter-spacing:1px;max-width:500px;margin-left:auto;margin-right:auto;line-height:1.8}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:50px;padding:40px 60px 100px;max-width:1400px;margin:0 auto}
  .card{cursor:pointer;transition:.4s}
  .card:hover{transform:translateY(-8px)}
  .card-img{height:380px;background:linear-gradient(135deg,#e0d8cc,#c8b8a8);display:flex;align-items:center;justify-content:center;font-size:90px;margin-bottom:25px;position:relative;overflow:hidden}
  .card-img::after{content:'VIEW';position:absolute;bottom:20px;right:20px;font-size:10px;letter-spacing:3px;color:#fff;background:rgba(0,0,0,.5);padding:8px 15px;opacity:0;transition:.3s}
  .card:hover .card-img::after{opacity:1}
  .card h3{font-size:18px;font-weight:400;letter-spacing:3px;margin-bottom:8px;font-style:italic}
  .card .price{font-size:15px;color:#8a7a6a;letter-spacing:2px}
  .card button{margin-top:15px;background:none;border:none;border-bottom:1px solid #1a1a1a;padding:5px 0;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:.3s;color:#1a1a1a}
  .card button:hover{letter-spacing:5px}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#faf8f5;padding:50px;transition:.5s;z-index:200;overflow-y:auto;box-shadow:-20px 0 60px rgba(0,0,0,.1)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:26px;font-weight:400;letter-spacing:8px;font-style:italic;margin-bottom:35px;padding-bottom:20px;border-bottom:1px solid #d5c8b8}
  .cart-item{display:flex;justify-content:space-between;padding:18px 0;border-bottom:1px solid #e8e0d5;font-size:14px;font-style:italic;letter-spacing:1px}
  .total{margin-top:30px;font-size:20px;letter-spacing:2px;font-style:italic;color:#1a1a1a;padding:20px 0;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a}
  .checkout{width:100%;margin-top:25px;padding:18px;background:#1a1a1a;color:#faf8f5;border:none;font-family:inherit;font-size:12px;letter-spacing:5px;text-transform:uppercase;cursor:pointer;transition:.3s}
  .checkout:hover{background:#5a4a3a}
  .close{position:absolute;top:20px;right:25px;cursor:pointer;font-size:24px;color:#1a1a1a}
  .del{color:#c44;cursor:pointer}
  footer{text-align:center;padding:60px;color:#8a7a6a;font-size:11px;letter-spacing:4px;border-top:1px solid #e8e0d5}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#p">Collection</a><a href="#p">Editorial</a><a href="#p">About</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">Spring / Summer 2026</div>
    <h1>PLAG</h1>
    <p>A study in quiet confidence</p>
  </div>
  <div class="scroll-hint">Scroll to explore ↓</div>
</section>
<div class="section-intro">
  <h2>The Collection</h2>
  <p>Одежда, которая говорит шёпотом, но запоминается надолго. Каждая вещь — часть большего нарратива.</p>
</div>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Your Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<footer>© PLAG — DIGITAL LOOKBOOK — 2026</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="card-img">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price}₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#aaa;font-style:italic">Your bag is empty</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Your bag is empty');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
