<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Vivienne Westwood Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Georgia','Times New Roman',serif}
  body{background:#1a0f0f;color:#e8dcc8;overflow-x:hidden;position:relative}
  .safety-pin{position:fixed;font-size:40px;color:#8b1a1a;opacity:.15;pointer-events:none;z-index:0;transform:rotate(45deg)}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 50px;background:#1a0f0f;border-bottom:2px solid #8b1a1a;position:sticky;top:0;z-index:100}
  .logo{font-size:28px;font-weight:400;letter-spacing:6px;color:#e8dcc8;font-style:italic;position:relative}
  .logo::before{content:'✠';color:#8b1a1a;margin-right:12px;font-style:normal}
  nav a{color:#a89878;text-decoration:none;margin:0 18px;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:.3s;font-style:italic}
  nav a:hover{color:#e8dcc8}
  .cart-btn{background:none;border:1px solid #8b1a1a;color:#e8dcc8;padding:9px 22px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:.3s;font-style:italic}
  .cart-btn:hover{background:#8b1a1a;color:#1a0f0f}
  .hero{height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#2a1515,#1a0f0f)}
  .hero::before{content:'ANARCHY';position:absolute;font-size:200px;font-weight:900;color:rgba(139,26,26,.05);top:50%;left:50%;transform:translate(-50%,-50%) rotate(-10deg);letter-spacing:10px;white-space:nowrap}
  .hero-content{position:relative;z-index:2}
  .hero .eyebrow{font-size:10px;letter-spacing:10px;text-transform:uppercase;color:#8b1a1a;margin-bottom:30px;font-style:italic}
  .hero h1{font-size:100px;font-weight:400;letter-spacing:12px;color:#e8dcc8;margin-bottom:20px;font-style:italic;text-shadow:3px 3px 0 #8b1a1a}
  .hero p{font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#a89878;font-style:italic}
  .hero .motto{margin-top:30px;font-size:11px;letter-spacing:3px;color:#8b1a1a;border-top:1px solid #8b1a1a;border-bottom:1px solid #8b1a1a;display:inline-block;padding:10px 25px;font-style:italic}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;padding:70px 50px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
  .card{background:#261515;border:1px solid #4a2020;padding:30px;text-align:center;transition:.4s;position:relative}
  .card::before{content:'✠';position:absolute;top:10px;right:12px;color:#8b1a1a;font-size:14px}
  .card:hover{border-color:#8b1a1a;background:#2e1818;transform:translateY(-4px)}
  .card .emoji{font-size:80px;margin:15px 0;filter:sepia(.5) hue-rotate(-20deg) brightness(.85)}
  .card h3{font-size:13px;font-weight:400;letter-spacing:3px;text-transform:uppercase;margin:18px 0 8px;color:#e8dcc8;font-style:italic}
  .card .price{font-size:17px;color:#a89878;margin-bottom:20px;letter-spacing:1px}
  .card button{background:none;border:1px solid #4a2020;color:#a89878;padding:11px 25px;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:3px;text-transform:uppercase;transition:.3s;width:100%;font-style:italic}
  .card button:hover{border-color:#8b1a1a;color:#e8dcc8;background:#8b1a1a}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#1a0f0f;padding:50px;transition:.4s;z-index:200;overflow-y:auto;border-left:2px solid #8b1a1a;box-shadow:-20px 0 60px rgba(0,0,0,.8)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:17px;font-weight:400;letter-spacing:5px;text-transform:uppercase;color:#e8dcc8;margin-bottom:35px;padding-bottom:20px;border-bottom:1px solid #4a2020;font-style:italic}
  .cart-item{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid #2a1515;font-size:12px;letter-spacing:1px;color:#a89878;font-style:italic}
  .total{margin-top:30px;font-size:17px;letter-spacing:2px;padding:18px 0;border-top:1px solid #8b1a1a;border-bottom:1px solid #8b1a1a;color:#e8dcc8;font-style:italic}
  .checkout{width:100%;margin-top:25px;padding:16px;background:#8b1a1a;color:#e8dcc8;border:none;font-family:inherit;font-size:11px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;transition:.3s;font-style:italic}
  .checkout:hover{background:#b02020}
  .close{position:absolute;top:20px;right:25px;cursor:pointer;font-size:22px;color:#8b1a1a}
  .del{color:#8b1a1a;cursor:pointer}
  footer{text-align:center;padding:60px;color:#4a2020;font-size:10px;letter-spacing:4px;text-transform:uppercase;border-top:1px solid #2a1515;margin-top:30px;position:relative;z-index:1;font-style:italic}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<div class="safety-pin" style="top:15%;left:5%">⚷</div>
<div class="safety-pin" style="bottom:20%;right:8%">⚷</div>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#p">Shop</a><a href="#p">Collections</a><a href="#p">Manifesto</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">London — Est. 2026</div>
    <h1>PLAG</h1>
    <p>Punk. Couture. Rebellion.</p>
    <div class="motto">Buy less. Choose well. Make it last.</div>
  </div>
</section>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Shopping Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>
<footer>✠ PLAG — Vivienne Westwood Style — 2026 ✠</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to Bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price.toLocaleString()} ₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#4a2020;font-style:italic">Your bag is empty</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Your bag is empty');alert('✠ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
