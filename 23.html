<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Balenciaga Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black','Helvetica Neue',Arial,sans-serif}
  body{background:#fff;color:#000;overflow-x:hidden}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;background:#fff;border-bottom:2px solid #000;position:sticky;top:0;z-index:100}
  .logo{font-size:26px;font-weight:900;letter-spacing:8px;color:#000;text-transform:uppercase}
  nav a{color:#000;text-decoration:none;margin:0 16px;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;transition:.2s;opacity:.5}
  nav a:hover{opacity:1}
  .cart-btn{background:#000;color:#fff;border:none;padding:10px 25px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;transition:.2s}
  .cart-btn:hover{background:#39ff14;color:#000}
  .hero{height:85vh;display:flex;align-items:center;justify-content:center;background:#fff;position:relative;border-bottom:2px solid #000}
  .hero-text{text-align:center;padding:0 20px}
  .hero-text h1{font-size:160px;font-weight:900;letter-spacing:-8px;line-height:.85;color:#000;margin-bottom:20px;text-transform:uppercase}
  .hero-text p{font-size:11px;font-weight:700;letter-spacing:8px;text-transform:uppercase;color:#000;background:#39ff14;display:inline-block;padding:8px 20px}
  .hero .neon-dot{position:absolute;width:10px;height:10px;background:#39ff14;border-radius:50%;top:20%;right:15%;box-shadow:0 0 20px #39ff14,0 0 40px #39ff14}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;padding:0;max-width:1400px;margin:0 auto;border-left:2px solid #000;border-right:2px solid #000}
  .card{background:#fff;padding:40px 25px;text-align:center;transition:.2s;border-right:2px solid #000;border-bottom:2px solid #000;position:relative}
  .card:nth-child(3n){border-right:none}
  .card:hover{background:#f5f5f5}
  .card:hover::after{content:'→';position:absolute;bottom:15px;right:15px;font-size:20px;font-weight:900;color:#39ff14}
  .card .emoji{font-size:85px;margin:20px 0;filter:grayscale(1)}
  .card h3{font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;color:#000}
  .card .price{font-size:16px;font-weight:700;color:#000;margin-bottom:20px}
  .card button{background:none;border:2px solid #000;padding:12px 30px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;transition:.2s;color:#000;width:100%}
  .card button:hover{background:#000;color:#39ff14;border-color:#000}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#fff;padding:40px;transition:.4s;z-index:200;overflow-y:auto;border-left:2px solid #000;box-shadow:-20px 0 60px rgba(0,0,0,.1)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:16px;font-weight:900;letter-spacing:4px;text-transform:uppercase;margin-bottom:30px;padding-bottom:15px;border-bottom:2px solid #000}
  .cart-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .total{margin-top:25px;font-size:16px;font-weight:900;letter-spacing:2px;padding:15px 0;border-top:2px solid #000;border-bottom:2px solid #000}
  .checkout{width:100%;margin-top:20px;padding:16px;background:#000;color:#fff;border:none;font-family:inherit;font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s}
  .checkout:hover{background:#39ff14;color:#000}
  .close{position:absolute;top:18px;right:22px;cursor:pointer;font-size:22px;font-weight:900}
  .del{color:#000;cursor:pointer;font-weight:900}
  footer{padding:40px;text-align:center;color:#000;font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;border-top:2px solid #000;margin-top:40px}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#p">Shop</a><a href="#p">Archive</a><a href="#p">Info</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-text">
    <h1>PLAG</h1>
    <p>Spring 2026</p>
  </div>
  <div class="neon-dot"></div>
</section>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Shopping Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<footer>PLAG — Balenciaga Style — 2026</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to Bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price.toLocaleString()} ₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#aaa;font-weight:700">Bag is empty</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Bag is empty');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
