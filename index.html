<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAG — Коллекция сайтов</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: #f4f4f4; 
            padding: 40px 20px; 
            text-align: center; 
            color: #111;
        }
        h1 { 
            font-size: 28px; 
            letter-spacing: 8px; 
            margin-bottom: 10px; 
            text-transform: uppercase;
        }
        p { 
            font-size: 14px; 
            color: #666; 
            margin-bottom: 30px; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 15px; 
            max-width: 900px; 
            margin: 0 auto; 
        }
        a { 
            display: flex; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px; 
            background: #fff; 
            color: #111; 
            text-decoration: none; 
            border: 1px solid #ddd; 
            border-radius: 10px; 
            font-weight: bold; 
            transition: 0.3s ease; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        a:hover { 
            background: #111; 
            color: #fff; 
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .num { 
            font-size: 12px; 
            color: #999; 
            margin-bottom: 5px; 
            font-weight: normal;
        }
        a:hover .num { color: #ccc; }
    </style>
</head>
<body>
    <h1>PLAG</h1>
    <p>Коллекция дизайнов. Нажми на любой, чтобы открыть.</p>

        <a href="24.html"><span class="num">#24</span> Balenciaga</a>

</body>
</html>
