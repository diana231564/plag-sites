<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Kinetic Typography</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black','Helvetica',sans-serif}
  body{background:#0a0a0a;color:#fff;overflow-x:hidden}
  header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 40px;z-index:100;background:rgba(10,10,10,.8);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.1)}
  .logo{font-size:28px;font-weight:900;letter-spacing:3px}
  nav a{color:#fff;text-decoration:none;margin:0 15px;font-size:12px;letter-spacing:2px;text-transform:uppercase;opacity:.6;transition:.3s}
  nav a:hover{opacity:1}
  .cart-btn{background:#fff;color:#0a0a0a;border:none;padding:10px 25px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:900;letter-spacing:1px;text-transform:uppercase;transition:.3s}
  .cart-btn:hover{background:#ff3b3b;color:#fff}
  .hero{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .kinetic-text{font-size:180px;font-weight:900;letter-spacing:-5px;line-height:.9;text-align:center;display:flex;gap:0}
  .kinetic-text span{display:inline-block;animation:stretch 2s ease-in-out infinite;transform-origin:center}
  .kinetic-text span:nth-child(1){animation-delay:0s}
  .kinetic-text span:nth-child(2){animation-delay:.1s}
  .kinetic-text span:nth-child(3){animation-delay:.2s}
  .kinetic-text span:nth-child(4){animation-delay:.3s}
  @keyframes stretch{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.3)}}
  .hero-sub{font-size:16px;letter-spacing:10px;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:30px;animation:fade 3s infinite}
  @keyframes fade{0%,100%{opacity:.3}50%{opacity:1}}
  .scroll-line{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:1px;height:60px;background:linear-gradient(180deg,#fff,transparent);animation:scrollDown 2s infinite}
  @keyframes scrollDown{0%{transform:translateX(-50%) scaleY(0);transform-origin:top}50%{transform:translateX(-50%) scaleY(1);transform-origin:top}51%{transform:translateX(-50%) scaleY(1);transform-origin:bottom}100%{transform:translateX(-50%) scaleY(0);transform-origin:bottom}}
  .section-title{padding:80px 40px 40px;text-align:center;font-size:14px;letter-spacing:8px;text-transform:uppercase;color:rgba(255,255,255,.4)}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;padding:20px 40px 100px;max-width:1400px;margin:0 auto}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);padding:30px;text-align:center;transition:.4s;position:relative;overflow:hidden}
  .card:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.3)}
  .card .emoji{font-size:80px;margin:20px 0;filter:grayscale(.5);transition:.4s}
  .card:hover .emoji{filter:grayscale(0);transform:scale(1.1)}
  .card h3{font-size:14px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin:15px 0;color:rgba(255,255,255,.8)}
  .card .price{font-size:22px;font-weight:900;color:#fff;margin-bottom:20px}
  .card button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:12px 25px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:2px;text-transform:uppercase;transition:.3s;width:100%}
  .card button:hover{background:#fff;color:#0a0a0a;border-color:#fff}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#0a0a0a;padding:40px;transition:.4s;z-index:200;overflow-y:auto;border-left:1px solid rgba(255,255,255,.2)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:20px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px;padding-bottom:15px;border-bottom:1px solid rgba(255,255,255,.2)}
  .cart-item{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px;letter-spacing:1px}
  .total{margin-top:25px;font-size:22px;font-weight:900;padding:15px 0;border-top:1px solid #fff;border-bottom:1px solid #fff;text-align:center}
  .checkout{width:100%;margin-top:20px;padding:16px;background:#fff;color:#0a0a0a;border:none;font-family:inherit;font-size:13px;font-weight:900;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:.3s}
  .checkout:hover{background:#ff3b3b;color:#fff}
  .close{position:absolute;top:20px;right:25px;cursor:pointer;font-size:24px;color:rgba(255,255,255,.6)}
  .del{color:#ff3b3b;cursor:pointer;font-weight:900}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#p">Collection</a><a href="#p">Motion</a><a href="#p">Info</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="kinetic-text"><span>P</span><span>L</span><span>A</span><span>G</span></div>
  <div class="hero-sub">Kinetic Fashion</div>
  <div class="scroll-line"></div>
</section>
<div class="section-title">The Collection</div>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price}₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#666">Bag is empty</p>';
  document.getElementById('total').textContent='TOTAL: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Bag is empty');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
