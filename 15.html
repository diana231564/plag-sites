<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Archival Index</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter','Helvetica Neue',sans-serif}
  body{background:#f4f2ed;color:#1a1a1a;overflow-x:hidden}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;border-bottom:1px solid #d0ccc0;position:sticky;top:0;background:#f4f2ed;z-index:100}
  .logo{font-size:24px;font-weight:600;letter-spacing:2px}
  .header-meta{font-size:11px;letter-spacing:1px;color:#8a8a7a;text-transform:uppercase}
  nav a{color:#1a1a1a;text-decoration:none;margin:0 15px;font-size:12px;letter-spacing:1px;text-transform:uppercase;opacity:.6;transition:.2s}
  nav a:hover{opacity:1}
  .cart-btn{background:none;border:1px solid #1a1a1a;padding:8px 18px;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:1px;text-transform:uppercase;transition:.2s}
  .cart-btn:hover{background:#1a1a1a;color:#f4f2ed}
  .hero{padding:100px 40px 60px;border-bottom:1px solid #d0ccc0}
  .hero-inner{max-width:1200px;margin:0 auto}
  .hero .label{font-size:10px;letter-spacing:2px;color:#8a8a7a;text-transform:uppercase;margin-bottom:20px;border:1px solid #d0ccc0;display:inline-block;padding:4px 10px}
  .hero h1{font-size:80px;font-weight:300;letter-spacing:-1px;line-height:1;margin-bottom:20px}
  .hero p{font-size:16px;color:#6a6a5a;max-width:500px;line-height:1.6}
  .index-bar{display:flex;gap:30px;padding:20px 40px;border-bottom:1px solid #d0ccc0;font-size:11px;letter-spacing:1px;color:#8a8a7a;text-transform:uppercase}
  .index-bar span{color:#1a1a1a;font-weight:500}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;padding:0;max-width:1400px;margin:0 auto}
  .card{border-right:1px solid #d0ccc0;border-bottom:1px solid #d0ccc0;padding:30px;transition:.2s;cursor:pointer;position:relative}
  .card:nth-child(3n){border-right:none}
  .card:hover{background:#fff}
  .card .code{font-size:10px;letter-spacing:1px;color:#8a8a7a;margin-bottom:20px;text-transform:uppercase}
  .card .emoji{font-size:60px;margin:15px 0;filter:grayscale(.3)}
  .card h3{font-size:14px;font-weight:500;letter-spacing:1px;margin:15px 0 8px;text-transform:uppercase}
  .card .price{font-size:18px;font-weight:300;color:#1a1a1a;margin-bottom:20px}
  .card button{background:none;border:none;border-bottom:1px solid #1a1a1a;padding:3px 0;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:2px;text-transform:uppercase;transition:.2s;color:#1a1a1a}
  .card button:hover{letter-spacing:3px}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#f4f2ed;padding:40px;transition:.4s;z-index:200;overflow-y:auto;border-left:1px solid #d0ccc0}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:20px;font-weight:400;letter-spacing:2px;margin-bottom:30px;padding-bottom:15px;border-bottom:1px solid #d0ccc0}
  .cart-item{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #e0dcd0;font-size:13px;letter-spacing:1px}
  .total{margin-top:25px;font-size:18px;font-weight:400;letter-spacing:1px;padding:15px 0;border-top:1px solid #1a1a1a;border-bottom:1px solid #1a1a1a}
  .checkout{width:100%;margin-top:20px;padding:15px;background:#1a1a1a;color:#f4f2ed;border:none;font-family:inherit;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s}
  .checkout:hover{background:#3a3a2a}
  .close{position:absolute;top:15px;right:20px;cursor:pointer;font-size:20px}
  .del{color:#c44;cursor:pointer}
  footer{padding:40px;text-align:center;color:#8a8a7a;font-size:10px;letter-spacing:2px;text-transform:uppercase;border-top:1px solid #d0ccc0}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<header>
  <div class="logo">PLAG</div>
  <div class="header-meta">Archive / Vol. 01</div>
  <nav><a href="#p">Catalogue</a><a href="#p">Index</a><a href="#p">Info</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-inner">
    <div class="label">Collection Index</div>
    <h1>Wardrobe<br>Archive</h1>
    <p>Каталогизированная коллекция базовой одежды. Каждый предмет пронумерован и описан в соответствии с архивной системой PLAG.</p>
  </div>
</section>
<div class="index-bar">
  <div>Items: <span>08</span></div>
  <div>Season: <span>2026</span></div>
  <div>Category: <span>Essentials</span></div>
</div>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Selected Items</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<footer>PLAG — Archival Index — 2026</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map((p,i)=>`
  <div class="card"><div class="code">PLG-${String(p.id).padStart(3,'0')}</div><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Select</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price}₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#aaa">No items selected</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('No items selected');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
