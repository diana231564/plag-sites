<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Luxury</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Playfair Display',Georgia,serif}
  body{background:#0d0d0d;color:#e8e8e8;overflow-x:hidden}
  .loader{position:fixed;inset:0;background:#0d0d0d;display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .8s}
  .loader.hide{opacity:0;pointer-events:none}
  .loader h1{font-size:60px;letter-spacing:20px;color:#c9a961;animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  header{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;align-items:center;padding:25px 60px;z-index:100;background:linear-gradient(180deg,rgba(13,13,13,.95),transparent)}
  .logo{font-size:26px;letter-spacing:12px;color:#c9a961}
  nav a{color:#e8e8e8;text-decoration:none;margin:0 20px;font-size:12px;letter-spacing:3px;text-transform:uppercase}
  nav a:hover{color:#c9a961}
  .cart-icon{cursor:pointer;color:#c9a961;letter-spacing:2px;font-size:13px;border:1px solid #c9a961;padding:8px 20px;transition:.3s;background:none;font-family:inherit}
  .cart-icon:hover{background:#c9a961;color:#0d0d0d}
  .hero{height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 50%,#1a1a1a,#0d0d0d);text-align:center}
  .hero h1{font-size:120px;font-weight:400;letter-spacing:40px;color:#c9a961;text-shadow:0 0 60px rgba(201,169,97,.3);margin-bottom:20px}
  .hero p{font-size:16px;letter-spacing:8px;color:#888;text-transform:uppercase}
  .section-title{text-align:center;font-size:48px;font-weight:400;letter-spacing:15px;color:#c9a961;padding:80px 0 40px}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;padding:0 60px 80px}
  .card{background:#141414;padding:40px;text-align:center;transition:.5s;border:1px solid transparent;position:relative;overflow:hidden}
  .card::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 40%,rgba(201,169,97,.05) 50%,transparent 60%);transform:translateX(-100%);transition:.6s}
  .card:hover::before{transform:translateX(100%)}
  .card:hover{border-color:#c9a961}
  .card .emoji{font-size:80px;margin:20px 0;filter:grayscale(1);transition:.5s}
  .card:hover .emoji{filter:grayscale(0);transform:scale(1.1)}
  .card h3{font-size:20px;font-weight:400;letter-spacing:4px;margin:15px 0;color:#e8e8e8}
  .card .price{color:#c9a961;font-size:22px;letter-spacing:2px;margin-bottom:20px}
  .card button{padding:12px 30px;background:none;border:1px solid #444;color:#888;font-family:inherit;font-size:11px;letter-spacing:3px;cursor:pointer;transition:.3s;text-transform:uppercase}
  .card button:hover{border-color:#c9a961;color:#c9a961}
  .cart-sidebar{position:fixed;right:-500px;top:0;width:500px;height:100vh;background:#0d0d0d;border-left:1px solid #c9a961;padding:50px;transition:.5s;z-index:200;overflow-y:auto}
  .cart-sidebar.open{right:0}
  .cart-sidebar h2{font-size:28px;font-weight:400;letter-spacing:8px;color:#c9a961;margin-bottom:40px}
  .cart-item{display:flex;justify-content:space-between;padding:20px 0;border-bottom:1px solid #1f1f1f;font-size:14px;letter-spacing:1px}
  .cart-item span:last-child{color:#c9a961}
  .total-lux{margin-top:30px;font-size:24px;letter-spacing:3px;color:#c9a961}
  .checkout-btn{width:100%;margin-top:30px;padding:20px;background:#c9a961;color:#0d0d0d;border:none;font-family:inherit;letter-spacing:5px;cursor:pointer;font-size:12px;text-transform:uppercase;transition:.3s}
  .checkout-btn:hover{background:#e8e8e8}
  .close{position:absolute;top:30px;right:30px;cursor:pointer;color:#c9a961;font-size:24px}
  footer{text-align:center;padding:60px;border-top:1px solid #1f1f1f;color:#666;letter-spacing:3px;font-size:11px}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<div class="loader" id="loader"><h1>PLAG</h1></div>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#products">Collection</a><a href="#products">New</a><a href="#products">About</a></nav>
  <button class="cart-icon" onclick="toggleCart()">BAG (<span id="count">0</span>)</button>
</header>
<section class="hero"><div><h1>PLAG</h1><p>Timeless Luxury Fashion</p></div></section>
<h2 class="section-title">Collection</h2>
<div class="products" id="products"></div>
<div class="cart-sidebar" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>YOUR BAG</h2>
  <div id="cartItems"></div>
  <div class="total-lux" id="total"></div>
  <button class="checkout-btn" onclick="checkout()">Checkout</button>
</div>
<footer>© 2024 PLAG — LUXURY FASHION HOUSE</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('products').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price.toLocaleString()} ₽ <span style="color:#c00;cursor:pointer;margin-left:10px" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="color:#666;letter-spacing:2px">Your bag is empty</p>';
  document.getElementById('total').textContent='TOTAL: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return;alert('✓ Заказ оформлен! Сумма: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
window.addEventListener('load',()=>setTimeout(()=>document.getElementById('loader').classList.add('hide'),1200));
render();
</script>
</body>
</html>
