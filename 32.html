<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Martine Rose Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif}
  body{background:#f0ebe0;color:#1a1a1a;overflow-x:hidden;position:relative}
  .sub-text{position:fixed;font-size:14px;font-weight:900;color:rgba(26,26,26,.06);letter-spacing:2px;pointer-events:none;z-index:0;text-transform:uppercase}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 50px;background:#f0ebe0;border-bottom:3px solid #1a1a1a;position:sticky;top:0;z-index:100}
  .logo{font-size:24px;font-weight:800;letter-spacing:2px;color:#1a1a1a;font-style:italic}
  .logo span{background:#1a1a1a;color:#f0ebe0;padding:2px 8px;margin-left:5px;font-style:normal}
  nav a{color:#1a1a1a;text-decoration:none;margin:0 16px;font-size:10px;letter-spacing:2px;text-transform:uppercase;opacity:.5;transition:.3s;font-weight:700}
  nav a:hover{opacity:1;background:#1a1a1a;color:#f0ebe0;padding:2px 6px}
  .cart-btn{background:#1a1a1a;color:#f0ebe0;border:none;padding:10px 22px;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:2px;text-transform:uppercase;transition:.2s;font-weight:700}
  .cart-btn:hover{background:#c44}
  .hero{height:85vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}
  .hero::before{content:'SUBVERT';position:absolute;font-size:220px;font-weight:900;color:rgba(26,26,26,.03);top:50%;left:50%;transform:translate(-50%,-50%) rotate(-5deg);white-space:nowrap;letter-spacing:10px}
  .hero-content{position:relative;z-index:2;max-width:700px;padding:0 30px}
  .hero .eyebrow{display:inline-block;background:#1a1a1a;color:#f0ebe0;padding:6px 16px;font-size:9px;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px;font-weight:700;transform:rotate(2deg)}
  .hero h1{font-size:130px;font-weight:900;letter-spacing:-3px;color:#1a1a1a;margin-bottom:20px;line-height:.9;font-style:italic}
  .hero p{font-size:12px;letter-spacing:4px;text-transform:uppercase;color:#666;font-weight:700}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:25px;padding:70px 50px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
  .card{background:#fff;padding:25px;text-align:center;transition:.3s;border:2px solid #1a1a1a;position:relative}
  .card:nth-child(2n){transform:rotate(-1deg)}
  .card:nth-child(3n){transform:rotate(1deg)}
  .card:hover{transform:rotate(0) scale(1.02);box-shadow:8px 8px 0 #1a1a1a}
  .card .emoji{font-size:80px;margin:15px 0;filter:grayscale(.3)}
  .card h3{font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin:18px 0 8px;color:#1a1a1a;font-style:italic}
  .card .price{font-size:16px;color:#c44;margin-bottom:20px;font-weight:800}
  .card button{background:none;border:2px solid #1a1a1a;padding:11px 25px;cursor:pointer;font-family:inherit;font-size:9px;letter-spacing:2px;text-transform:uppercase;transition:.2s;width:100%;color:#1a1a1a;font-weight:700}
  .card button:hover{background:#1a1a1a;color:#f0ebe0}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#f0ebe0;padding:50px;transition:.4s;z-index:200;overflow-y:auto;border-left:3px solid #1a1a1a;box-shadow:-20px 0 60px rgba(0,0,0,.1)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:16px;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px;padding-bottom:15px;border-bottom:2px solid #1a1a1a;font-style:italic}
  .cart-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #ddd;font-size:11px;letter-spacing:1px;font-weight:700}
  .total{margin-top:25px;font-size:16px;font-weight:800;letter-spacing:2px;padding:15px 0;border-top:2px solid #1a1a1a;border-bottom:2px solid #1a1a1a}
  .checkout{width:100%;margin-top:20px;padding:16px;background:#c44;color:#fff;border:none;font-family:inherit;font-size:10px;font-weight:800;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s}
  .checkout:hover{background:#1a1a1a}
  .close{position:absolute;top:18px;right:22px;cursor:pointer;font-size:22px;font-weight:800}
  .del{color:#c44;cursor:pointer;font-weight:800}
  footer{padding:40px;text-align:center;color:#999;font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;border-top:1px solid #ddd;margin-top:40px;position:relative;z-index:1}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<div class="sub-text" style="top:15%;left:3%;transform:rotate(-90deg)">SUBVERT</div>
<div class="sub-text" style="bottom:20%;right:3%;transform:rotate(90deg)">DISRUPT</div>
<header>
  <div class="logo">PLAG<span>/R</span></div>
  <nav><a href="#p">Shop</a><a href="#p">Subculture</a><a href="#p">Info</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">London — Est. 2026</div>
    <h1>PLAG</h1>
    <p>Subversive Classic. Ironic. Bold.</p>
  </div>
</section>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Shopping Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<footer>PLAG — Martine Rose Style — 2026</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to Bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price.toLocaleString()} ₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#aaa;font-weight:700">Bag is empty</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Bag is empty');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
