<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Gothic</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Cinzel','Garamond',Georgia,serif}
  body{background:#0a0000;background-image:radial-gradient(circle at 50% 0%,#2a0000 0%,#0a0000 50%);color:#c9a9a9;min-height:100vh;overflow-x:hidden;position:relative}
  .fog{position:fixed;inset:0;background:radial-gradient(circle at 20% 40%,rgba(139,0,0,.15),transparent 40%),radial-gradient(circle at 80% 60%,rgba(139,0,0,.1),transparent 40%);pointer-events:none;z-index:0;animation:fog 15s infinite}
  @keyframes fog{0%,100%{opacity:.6}50%{opacity:1}}
  .bat{position:fixed;font-size:20px;opacity:.3;pointer-events:none;z-index:0;animation:fly 20s linear infinite}
  @keyframes fly{from{transform:translate(-100px,100vh)}to{transform:translate(100vw,-100px)}}
  header{display:flex;justify-content:space-between;align-items:center;padding:20px 50px;background:linear-gradient(180deg,rgba(20,0,0,.95),rgba(10,0,0,.9));border-bottom:1px solid #4a0000;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
  .logo{font-size:38px;font-weight:bold;letter-spacing:12px;color:#8b0000;font-family:'Cinzel',Georgia,serif;text-shadow:0 0 20px rgba(139,0,0,.8),0 0 40px rgba(139,0,0,.4);position:relative}
  .logo::before,.logo::after{content:'✠';color:#4a0000;font-size:20px;margin:0 12px;display:inline-block;vertical-align:middle}
  nav a{color:#c9a9a9;text-decoration:none;margin:0 20px;font-size:14px;letter-spacing:4px;text-transform:uppercase;transition:.4s;font-family:'Cinzel',serif;position:relative;padding:5px 0}
  nav a::after{content:'';position:absolute;bottom:0;left:50%;width:0;height:1px;background:#8b0000;transition:.4s;transform:translateX(-50%)}
  nav a:hover{color:#8b0000;text-shadow:0 0 10px #8b0000}
  nav a:hover::after{width:100%}
  .cart-btn{background:linear-gradient(180deg,#2a0000,#1a0000);border:1px solid #8b0000;color:#c9a9a9;padding:12px 28px;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:3px;text-transform:uppercase;transition:.4s;position:relative}
  .cart-btn::before{content:'✠';margin-right:8px;color:#8b0000}
  .cart-btn:hover{background:#8b0000;color:#0a0000;box-shadow:0 0 20px rgba(139,0,0,.8)}
  .hero{padding:140px 50px 100px;text-align:center;position:relative;z-index:1}
  .hero .ornament{font-size:24px;color:#4a0000;letter-spacing:15px;margin-bottom:20px;animation:flicker 4s infinite}
  @keyframes flicker{0%,100%{opacity:.5}50%{opacity:1}}
  .hero h1{font-size:130px;font-weight:bold;letter-spacing:25px;color:#8b0000;font-family:'Cinzel',Georgia,serif;text-shadow:0 0 30px rgba(139,0,0,.8),0 0 60px rgba(139,0,0,.5),0 0 100px rgba(139,0,0,.3);margin-bottom:20px;animation:pulse 3s infinite}
  @keyframes pulse{0%,100%{text-shadow:0 0 30px rgba(139,0,0,.8),0 0 60px rgba(139,0,0,.5)}50%{text-shadow:0 0 40px rgba(139,0,0,1),0 0 80px rgba(139,0,0,.7),0 0 120px rgba(139,0,0,.5)}}
  .hero p{font-size:16px;letter-spacing:8px;color:#7a5a5a;text-transform:uppercase;font-family:'Cinzel',serif;margin-top:20px;border-top:1px solid #4a0000;border-bottom:1px solid #4a0000;display:inline-block;padding:15px 40px}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:35px;padding:60px 50px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
  .card{background:linear-gradient(180deg,rgba(20,0,0,.8),rgba(10,0,0,.9));border:1px solid #4a0000;padding:35px 25px;text-align:center;transition:.5s;position:relative;overflow:hidden}
  .card::before{content:'✠';position:absolute;top:10px;left:50%;transform:translateX(-50%);color:#4a0000;font-size:18px}
  .card::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(139,0,0,.1),transparent 70%);opacity:0;transition:.5s;pointer-events:none}
  .card:hover{border-color:#8b0000;box-shadow:0 0 40px rgba(139,0,0,.4);transform:translateY(-8px)}
  .card:hover::after{opacity:1}
  .card .emoji{font-size:80px;margin:20px 0;filter:drop-shadow(0 0 20px rgba(139,0,0,.6)) grayscale(.5);transition:.5s}
  .card:hover .emoji{filter:drop-shadow(0 0 30px rgba(139,0,0,1)) grayscale(.2);transform:scale(1.1)}
  .card h3{font-size:16px;color:#c9a9a9;letter-spacing:4px;text-transform:uppercase;margin:15px 0;font-family:'Cinzel',serif;font-weight:normal}
  .card .price{font-size:22px;color:#8b0000;margin-bottom:20px;font-family:'Cinzel',serif;text-shadow:0 0 15px rgba(139,0,0,.5)}
  .card button{background:none;border:1px solid #8b0000;color:#c9a9a9;padding:12px 30px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;transition:.4s;width:100%}
  .card button:hover{background:#8b0000;color:#0a0000;box-shadow:0 0 20px rgba(139,0,0,.8)}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:linear-gradient(180deg,#1a0000,#0a0000);padding:40px;transition:.5s;z-index:200;overflow-y:auto;border-left:1px solid #4a0000;box-shadow:-20px 0 60px rgba(0,0,0,.9)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:26px;color:#8b0000;letter-spacing:8px;font-family:'Cinzel',serif;margin-bottom:30px;text-align:center;text-shadow:0 0 20px rgba(139,0,0,.6);border-bottom:1px solid #4a0000;padding-bottom:15px}
  .cart-item{display:flex;justify-content:space-between;padding:15px;background:rgba(139,0,0,.08);border:1px solid #2a0000;margin-bottom:8px;font-size:13px;letter-spacing:1px}
  .total{margin-top:25px;font-size:20px;color:#8b0000;text-align:center;padding:15px;border-top:1px solid #4a0000;font-family:'Cinzel',serif;text-shadow:0 0 15px rgba(139,0,0,.5)}
  .checkout{width:100%;margin-top:25px;padding:18px;background:linear-gradient(180deg,#8b0000,#5a0000);color:#0a0000;border:1px solid #8b0000;font-family:'Cinzel',serif;font-size:13px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;font-weight:bold;transition:.4s}
  .checkout:hover{box-shadow:0 0 30px rgba(139,0,0,.8);transform:scale(1.02)}
  .close{position:absolute;top:20px;right:20px;cursor:pointer;font-size:24px;color:#8b0000;transition:.3s}
  .close:hover{text-shadow:0 0 15px #8b0000;transform:rotate(90deg)}
  .del{color:#8b0000;cursor:pointer;font-weight:bold}
  footer{text-align:center;padding:60px;color:#4a0000;font-size:11px;letter-spacing:6px;border-top:1px solid #2a0000;margin-top:40px;font-family:'Cinzel',serif;position:relative;z-index:1}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<div class="fog"></div>
<div class="bat" style="animation-delay:0s">🦇</div>
<div class="bat" style="animation-delay:7s">🦇</div>
<div class="bat" style="animation-delay:14s">🦇</div>
<header>
  <div class="logo">PLAG</div>
  <nav><a href="#p">Гардероб</a><a href="#p">Коллекция</a><a href="#p">Легенда</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Корзина (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="ornament">✠ ✠ ✠</div>
  <h1>PLAG</h1>
  <p>Тёмная элегантность</p>
</section>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>✠ КОРЗИНА ✠</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Оформить заказ</button>
</div>
<footer>✠ PLAG ✠ MEMENTO MORI ✠ 2024 ✠</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Приобрести</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price}₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#4a0000;letter-spacing:2px">Пусто...</p>';
  document.getElementById('total').textContent='Итого: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Корзина пуста...');alert('✠ Заказ оформлен! Сумма: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
