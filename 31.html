<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAG — Diesel Style</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Arial Black','Helvetica',sans-serif}
  body{background:#1a1a1a;color:#fff;overflow-x:hidden;position:relative}
  .denim-texture{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.04;background-image:repeating-linear-gradient(45deg,#4a6a8a 0,#4a6a8a 1px,transparent 1px,transparent 3px),repeating-linear-gradient(-45deg,#4a6a8a 0,#4a6a8a 1px,transparent 1px,transparent 3px)}
  header{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;background:#1a1a1a;border-bottom:3px solid #ff3b3b;position:sticky;top:0;z-index:100}
  .logo{font-size:36px;font-weight:900;letter-spacing:-1px;color:#fff;text-transform:uppercase}
  .logo span{color:#ff3b3b}
  nav a{color:#fff;text-decoration:none;margin:0 14px;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;opacity:.6;transition:.2s}
  nav a:hover{opacity:1;color:#ff3b3b}
  .cart-btn{background:#ff3b3b;color:#fff;border:none;padding:10px 22px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:900;letter-spacing:1px;text-transform:uppercase;transition:.2s}
  .cart-btn:hover{background:#fff;color:#1a1a1a}
  .hero{height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;background:radial-gradient(ellipse at center,#2a1a1a,#1a1a1a)}
  .hero::before{content:'BE STUPID';position:absolute;font-size:180px;font-weight:900;color:rgba(255,59,59,.04);top:50%;left:50%;transform:translate(-50%,-50%) rotate(-8deg);white-space:nowrap;letter-spacing:5px}
  .hero-content{position:relative;z-index:2}
  .hero .eyebrow{display:inline-block;background:#ff3b3b;color:#fff;padding:6px 16px;font-size:10px;font-weight:900;letter-spacing:3px;text-transform:uppercase;margin-bottom:30px;transform:rotate(-2deg)}
  .hero h1{font-size:140px;font-weight:900;letter-spacing:-4px;color:#fff;margin-bottom:20px;line-height:.85;text-transform:uppercase;text-shadow:6px 6px 0 #ff3b3b}
  .hero p{font-size:14px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#ff3b3b}
  .products{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px;padding:60px 40px;max-width:1400px;margin:0 auto;position:relative;z-index:1}
  .card{background:#222;border:2px solid #333;padding:25px;text-align:center;transition:.2s;position:relative}
  .card::before{content:'!';position:absolute;top:-10px;right:-10px;width:30px;height:30px;background:#ff3b3b;color:#fff;border-radius:50%;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:18px}
  .card:hover{border-color:#ff3b3b;transform:translateY(-4px)}
  .card .emoji{font-size:80px;margin:15px 0;filter:grayscale(.5) contrast(1.2)}
  .card h3{font-size:13px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin:18px 0 8px;color:#fff}
  .card .price{font-size:18px;font-weight:900;color:#ff3b3b;margin-bottom:20px}
  .card button{background:none;border:2px solid #ff3b3b;color:#ff3b3b;padding:11px 25px;cursor:pointer;font-family:inherit;font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase;transition:.2s;width:100%}
  .card button:hover{background:#ff3b3b;color:#fff}
  .cart-panel{position:fixed;top:0;right:-450px;width:450px;height:100vh;background:#1a1a1a;padding:40px;transition:.4s;z-index:200;overflow-y:auto;border-left:3px solid #ff3b3b;box-shadow:-20px 0 60px rgba(0,0,0,.8)}
  .cart-panel.open{right:0}
  .cart-panel h2{font-size:18px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#fff;margin-bottom:30px;padding-bottom:15px;border-bottom:2px solid #ff3b3b}
  .cart-item{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #333;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#ccc}
  .total{margin-top:25px;font-size:18px;font-weight:900;letter-spacing:2px;padding:15px 0;border-top:2px solid #ff3b3b;border-bottom:2px solid #ff3b3b;color:#ff3b3b}
  .checkout{width:100%;margin-top:20px;padding:15px;background:#ff3b3b;color:#fff;border:none;font-family:inherit;font-size:11px;font-weight:900;letter-spacing:3px;text-transform:uppercase;cursor:pointer;transition:.2s}
  .checkout:hover{background:#fff;color:#1a1a1a}
  .close{position:absolute;top:18px;right:22px;cursor:pointer;font-size:22px;font-weight:900;color:#ff3b3b}
  .del{color:#ff3b3b;cursor:pointer;font-weight:900}
  footer{padding:40px;text-align:center;color:#666;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;border-top:1px solid #333;margin-top:40px;position:relative;z-index:1}
/* ===== MOBILE PATCH ===== */
@media (max-width: 900px) {
  header { flex-wrap: wrap !important; padding: 14px 20px !important; gap: 10px !important; }
  .logo { font-size: 22px !important; letter-spacing: 3px !important; }
  nav { order: 3; width: 100%; display: flex !important; flex-wrap: wrap !important; justify-content: center !important; gap: 8px !important; margin-top: 8px; }
  nav a { margin: 0 !important; font-size: 11px !important; padding: 6px 10px !important; }
  .cart-btn, .cart-icon { font-size: 11px !important; padding: 8px 14px !important; }
  .hero { height: auto !important; min-height: 55vh !important; padding: 60px 20px !important; }
  .hero h1 { font-size: 48px !important; letter-spacing: 6px !important; line-height: 1.1 !important; }
  .hero p { font-size: 12px !important; letter-spacing: 2px !important; }
  .hero .eyebrow, .hero .ornament, .hero .label { font-size: 10px !important; letter-spacing: 4px !important; margin-bottom: 15px !important; }
  .kinetic-text { font-size: 80px !important; }
  .section-title, .section-intro h2 { font-size: 26px !important; letter-spacing: 4px !important; }
  .section-intro { padding: 40px 20px 20px !important; }
  .products { grid-template-columns: 1fr !important; gap: 20px !important; padding: 30px 20px 60px !important; }
  .card { padding: 20px 15px !important; transform: none !important; }
  .card-img, .card .card-img { height: 220px !important; font-size: 60px !important; }
  .card .emoji { font-size: 60px !important; }
  .card h3 { font-size: 14px !important; }
  .card .price { font-size: 16px !important; }
  .card button { padding: 10px 18px !important; font-size: 11px !important; }
  .cart-panel, .cart-sidebar { width: 100% !important; right: -100% !important; padding: 25px 20px !important; }
  .cart-panel.open, .cart-sidebar.open { right: 0 !important; }
  .cart-panel h2, .cart-sidebar h2 { font-size: 20px !important; letter-spacing: 3px !important; }
  .total, .total-lux { font-size: 16px !important; }
  .checkout, .checkout-btn { padding: 14px !important; font-size: 12px !important; }
  footer { padding: 30px 20px !important; font-size: 10px !important; letter-spacing: 2px !important; }
  .toast, .notification { left: 20px !important; right: 20px !important; transform: translateY(100px) !important; }
  .toast.show, .notification.show { transform: translateY(0) !important; }
  .search-box { padding: 15px 20px !important; }
  .search-box input { font-size: 15px !important; padding: 10px !important; }
  .loader h1 { font-size: 36px !important; letter-spacing: 12px !important; }
  .modal-content, .modal-inner { width: 95% !important; padding: 20px !important; }
}
@media (max-width: 480px) {
  .hero h1 { font-size: 36px !important; letter-spacing: 3px !important; }
  .hero { min-height: 45vh !important; padding: 40px 15px !important; }
  .card-img, .card .card-img { height: 180px !important; font-size: 50px !important; }
  .logo { font-size: 18px !important; letter-spacing: 2px !important; }
  nav a { font-size: 10px !important; padding: 5px 8px !important; }
  .kinetic-text { font-size: 60px !important; }
  .hero .ornament, .hero .eyebrow { letter-spacing: 2px !important; }
}
/* ===== /MOBILE PATCH ===== */
</style>
</head>
<body>
<div class="denim-texture"></div>
<header>
  <div class="logo">PLAG<span>.</span></div>
  <nav><a href="#p">Shop</a><a href="#p">Denim</a><a href="#p">Stupid</a></nav>
  <button class="cart-btn" onclick="toggleCart()">Bag (<span id="count">0</span>)</button>
</header>
<section class="hero">
  <div class="hero-content">
    <div class="eyebrow">Only the Brave</div>
    <h1>PLAG</h1>
    <p>Denim. Rebellion. Attitude.</p>
  </div>
</section>
<div class="products" id="p"></div>
<div class="cart-panel" id="cart">
  <span class="close" onclick="toggleCart()">✕</span>
  <h2>Shopping Bag</h2>
  <div id="cartItems"></div>
  <div class="total" id="total"></div>
  <button class="checkout" onclick="checkout()">Checkout</button>
</div>
<footer>PLAG — Diesel Style — 2026</footer>
<script>
const products=[
  {id:1,name:'Худи Oversize',price:4500,emoji:'👕'},
  {id:2,name:'Джинсы Straight',price:5500,emoji:'👖'},
  {id:3,name:'Кроссовки White',price:8500,emoji:'👟'},
  {id:4,name:'Куртка Bomber',price:7500,emoji:'🧥'},
  {id:5,name:'Футболка Basic',price:2500,emoji:'👕'},
  {id:6,name:'Кепка Classic',price:1500,emoji:'🧢'},
  {id:7,name:'Свитер Wool',price:5500,emoji:'🧶'},
  {id:8,name:'Сумка Canvas',price:3500,emoji:'👜'}
];
let cart=[];
function render(){document.getElementById('p').innerHTML=products.map(p=>`
  <div class="card"><div class="emoji">${p.emoji}</div><h3>${p.name}</h3>
  <div class="price">${p.price.toLocaleString()} ₽</div>
  <button onclick="add(${p.id})">Add to Bag</button></div>`).join('');}
function add(id){cart.push(products.find(x=>x.id===id));update();}
function update(){
  document.getElementById('count').textContent=cart.length;
  document.getElementById('cartItems').innerHTML=cart.map((c,i)=>
    `<div class="cart-item"><span>${c.name}</span><span>${c.price.toLocaleString()} ₽ <span class="del" onclick="rm(${i})">✕</span></span></div>`).join('')||'<p style="text-align:center;color:#444;font-weight:900">BAG IS EMPTY</p>';
  document.getElementById('total').textContent='Total: '+cart.reduce((s,c)=>s+c.price,0).toLocaleString()+' ₽';
}
function rm(i){cart.splice(i,1);update();}
function toggleCart(){document.getElementById('cart').classList.toggle('open');}
function checkout(){if(!cart.length)return alert('Bag is empty');alert('✓ Order placed! Total: '+cart.reduce((s,c)=>s+c.price,0)+' ₽');cart=[];update();toggleCart();}
render();
</script>
</body>
</html>
